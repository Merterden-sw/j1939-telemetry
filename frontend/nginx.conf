# ---------------------------------------------------------------------------
# Statik arayuz + backend proxy (REST ve WebSocket)
# ---------------------------------------------------------------------------
upstream telemetry_backend {
    server backend_telemetry:8000;
}

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    charset utf-8;
    access_log /var/log/nginx/access.log;

    gzip on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- statik dosyalar ---------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Her istekte ETag ile yeniden dogrulama zorunlu kilinir (degismemisse
    # 304 ile ucuz kalir); boylece deploy sonrasi eski JS/CSS onbellekte
    # sessizce kalmaz.
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
    }

    # Arac gorselleri: nadiren degisir, uzun sureli onbellege alinir.
    location /img/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    # --- REST API ----------------------------------------------------------
    location /api/ {
        proxy_pass         http://telemetry_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # --- WebSocket telemetri akisi ----------------------------------------
    location /ws {
        proxy_pass         http://telemetry_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;

        # Telemetri akisi uzun sureli acik kalir.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # --- konteyner saglik kontrolu ----------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
